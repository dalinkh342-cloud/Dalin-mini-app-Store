<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Dalin Mini Apps</title>
  <link rel="stylesheet" href="catalog.css">
  <link rel="stylesheet" href="shop-ui.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="shop-ui.js"></script>
</head>
<body>
  <header class="app-bar">
    <div class="shell nav">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">DA</span>
        <div>
          <strong>Dalin Mini Apps</strong>
          <small>Telegram Mini App</small>
        </div>
      </div>
      <label class="language">
        <span id="language-label" class="sr-only">ភាសា</span>
        <select id="language" aria-labelledby="language-label">
          <option lang="km" value="km">ខ្មែរ</option>
          <option lang="en" value="en">English</option>
        </select>
      </label>
    </div>
  </header>
  <main class="shell content"><div id="shop-root"><div hidden>
    <h1 data-copy="title">កម្មវិធីរបស់យើង</h1>
    <p class="intro" data-copy="intro">ជ្រើសកម្មវិធីសម្រាប់អាជីវកម្មរបស់អ្នក</p>
    <div class="products">
      <button class="product staffday" type="button" data-action="staffday">
        <img src="staffday.webp" alt="" width="112" height="112">
        <span class="product-copy">
          <strong>StaffDay</strong>
          <span data-copy="staffday">វត្តមាន និងការឈប់សម្រាក</span>
        </span>
        <span class="arrow" aria-hidden="true"></span>
      </button>
      <button class="product inventra" type="button" data-action="inventra">
        <img src="inventra.webp" alt="" width="112" height="112">
        <span class="product-copy">
          <strong>Inventra</strong>
          <span data-copy="inventra">គ្រប់គ្រងស្តុក និងទ្រព្យសម្បត្តិ</span>
        </span>
        <span class="arrow" aria-hidden="true"></span>
      </button>
      <button class="product luyvio" type="button" data-action="luyvio">
        <img src="luyvio.webp" alt="" width="112" height="112">
        <span class="product-copy">
          <strong>Luyvio</strong>
          <span data-copy="luyvio">វិក្កយបត្រ និងសម្រង់តម្លៃ</span>
        </span>
        <span class="arrow" aria-hidden="true"></span>
      </button>
      <button class="product fleetday" type="button" data-action="fleetday">
        <img src="fleetday.webp" alt="" width="112" height="112">
        <span class="product-copy">
          <strong>FleetDay</strong>
          <span data-copy="fleetday">កក់ឡាន និងបន្ទប់ប្រជុំ</span>
        </span>
        <span class="arrow" aria-hidden="true"></span>
      </button>
    </div>
    <div class="actions">
      <button type="button" data-action="mine" data-copy="mine">សំណើរបស់ខ្ញុំ</button>
      <button type="button" data-action="contact" data-copy="contact">ទាក់ទងក្រុមលក់</button>
    </div>
    </div></div><p id="status" class="status" role="status" aria-live="polite" hidden></p>
  </main>
  <dialog id="shop-dialog" aria-labelledby="shop-dialog-title"></dialog>
</body>
</html>
